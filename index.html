<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>우리집 포켓몬 대결</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:radial-gradient(circle at 50% 0,#3a4a8c,#141733 70%);background-attachment:fixed;color:#fff;min-height:100vh;user-select:none;-webkit-user-select:none}
.screen{display:none;max-width:560px;margin:0 auto;padding:12px 12px 40px;min-height:100vh}
.screen.on{display:block}
h1{font-size:28px;text-align:center;margin:14px 0 2px;letter-spacing:-1px}
h2{font-size:18px;margin:0 0 10px}
.sub{text-align:center;color:#b9bfe6;font-size:14px;margin-bottom:16px}
.panel{background:rgba(255,255,255,.08);border-radius:16px;padding:14px;margin-bottom:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:44px}
button{font:inherit;border:0;border-radius:12px;padding:11px;background:#3b4482;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
button.sel{background:#ffcb05;color:#222}
button.big{width:100%;padding:16px;font-size:19px;background:linear-gradient(#ff5a5a,#d62828);box-shadow:0 4px 0 #8f1515}
button.big:active{transform:translateY(3px);box-shadow:0 1px 0 #8f1515}
input{font:inherit;border-radius:10px;border:0;padding:10px;flex:1;min-width:0;font-size:16px}
.pl{display:flex;gap:8px;align-items:center;margin:8px 0}
.pl button{padding:10px 12px;font-size:14px;flex:none;width:74px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{position:relative;border-radius:14px;overflow:hidden;background:#fff;aspect-ratio:1;border:3px solid rgba(255,255,255,.2);cursor:pointer}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .nm{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);font-size:12px;text-align:center;padding:3px 1px;font-weight:700}
.card .ty{position:absolute;top:3px;right:3px;font-size:10px;padding:1px 5px;border-radius:7px;font-weight:700;color:#fff;text-shadow:0 1px 1px #0008}
.card.taken{opacity:.45;cursor:default}
.card .own{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.12)}
.who{font-size:20px;font-weight:900;text-align:center;margin:6px 0 10px}
/* battle */
#hpTop{position:sticky;top:0;z-index:5;background:rgba(20,23,51,.92);backdrop-filter:blur(6px);margin:-12px -12px 6px;padding:10px 12px;border-bottom:1px solid #fff2}
.rnd{display:flex;justify-content:space-between;font-size:14px;color:#ffcb05;font-weight:900}
.hpBox{background:linear-gradient(160deg,#f3f4fc 0%,#cfd4ee 60%,#a4acd6 100%);border-radius:14px;padding:8px 9px 4px;margin-bottom:8px;box-shadow:0 3px 8px #0006}
.bar{position:relative;height:20px;border-radius:999px;overflow:hidden;border:1.5px solid #3a2a2a;box-shadow:0 3px 5px #0005;transition:background .6s}
.bar i{display:block;height:100%;transition:width .6s ease,background .6s}
.bar::after{content:"";position:absolute;left:6%;right:6%;top:18%;height:26%;border-radius:999px;background:linear-gradient(90deg,#fff0,#ffffffd9 12%,#ffffffd9 88%,#fff0);filter:blur(1px);pointer-events:none}
.bar.g{background:linear-gradient(#a8eab0,#8fdc99 50%,#84d38e)}.bar.g i{background:linear-gradient(#17692a,#2fa544 50%,#269437);border-right:1.5px solid #0f4a1c}
.bar.y{background:linear-gradient(#fff0a8,#f9e07e 50%,#f3d56e)}.bar.y i{background:linear-gradient(#a37800,#e2b300 50%,#d1a300);border-right:1.5px solid #6e5100}
.bar.r{background:linear-gradient(#f6a7a7,#ef8f8f 50%,#e98383)}.bar.r i{background:linear-gradient(#8c1a12,#c2291c 50%,#b5221a);border-right:1.5px solid #5a120c}
.hpNum{text-align:center;font:900 17px Georgia,'Times New Roman',serif;color:#111;text-shadow:0 3px 4px #0007;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
#arena{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 10px}
.fighter{position:relative;text-align:center}
.pic{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:1;background:#fff;border:4px solid #fff3;transition:transform .2s,border-color .2s}
.pic img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .3s}
.fighter.turn .pic{border-color:#ffcb05;box-shadow:0 0 18px #ffcb05aa;transform:scale(1.04)}
.fighter .tag{margin-top:6px;font-weight:800;font-size:15px}
.fighter .ptag{font-size:12px;color:#d0d4f5}
.face{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);font-size:30vw;line-height:1;transition:transform .15s}
@media(min-width:560px){.face{font-size:150px}}
.pic.hurt img{filter:sepia(1) saturate(4) hue-rotate(-40deg) brightness(.9)}
.pic.hurt .face{transform:translate(-50%,-50%) scale(.55)}
.pic.shake{animation:shake .5s}
.pic.smug .face{transform:translate(-50%,-50%) scale(.55);animation:smug .35s ease-in-out 3 alternate}
@keyframes smug{from{rotate:-12deg}to{rotate:12deg}}
.pic.smug img{filter:brightness(1.08) saturate(1.2)}
@keyframes shake{0%,100%{translate:0}15%{translate:-12px 0}30%{translate:10px 0}45%{translate:-8px 0}60%{translate:6px 0}75%{translate:-3px 0}}
.dz{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;gap:8%;width:80%;justify-content:center}
.dz span{display:inline-flex;align-items:center;justify-content:center;width:42%;aspect-ratio:1;background:#fff;border-radius:50%;border:3px solid #222;font-size:min(16vw,80px);font-weight:900;color:#222;animation:spin 1s linear infinite;line-height:1}
.dz span:last-child{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.fighter.out .pic{filter:saturate(.55) brightness(.92)}
.eye{position:absolute;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--fc);box-shadow:0 0 6px 4px var(--fc);display:none}
.eye i{position:absolute;inset:4%;display:block;animation:spin 1.6s linear infinite}
.eye svg{width:100%;height:100%;display:block;overflow:visible}
.eye path{fill:none;stroke:var(--sc);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.fighter.out .eye{display:block}
.fighter.out .tag::after{content:" 💫"}
.dmg{position:absolute;left:50%;top:6%;transform:translateX(-50%);font-size:34px;font-weight:900;color:#ff3b3b;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;white-space:nowrap;z-index:3;animation:float 1.4s ease-out forwards}
.dmg.miss{color:#888;font-size:24px}
@keyframes float{0%{opacity:0;translate:0 20px;scale:.6}15%{opacity:1;translate:0 0;scale:1.25}30%{scale:1}100%{opacity:0;translate:0 -50px}}
#turnInfo{text-align:center;font-size:19px;font-weight:900;margin:8px 0;min-height:28px}
#moveName{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;pointer-events:none;z-index:30;opacity:0;white-space:nowrap;text-shadow:0 3px 0 #000,0 0 14px currentColor}
#moveName.go{animation:mv 1.1s ease-out}
@keyframes mv{0%{opacity:0;scale:.4}20%{opacity:1;scale:1.15}35%{scale:1}80%{opacity:1}100%{opacity:0;scale:1.1}}
#moves{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:120px}
#moves button{padding:16px 8px;font-size:17px;border-radius:14px;box-shadow:0 4px 0 #0005;text-shadow:0 1px 2px #0008}
#moves button:active{transform:translateY(3px);box-shadow:0 1px 0 #0005}
#moves .wait{grid-column:1/3;text-align:center;color:#c8cdf0;padding-top:30px;font-size:16px}
#log{margin-top:14px;font-size:13px;color:#cfd3f3;max-height:110px;overflow:auto;background:#0003;border-radius:10px;padding:8px 10px;line-height:1.55}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.proj,.part{position:fixed;left:0;top:0;font-size:46px;line-height:1;margin:-23px 0 0 -23px;will-change:transform}
.part{font-size:28px;margin:-14px 0 0 -14px}
.ring{position:fixed;border-radius:50%;border:6px solid;pointer-events:none}
#flash{position:fixed;inset:0;pointer-events:none;z-index:19;opacity:0}
/* modal */
#modal{position:fixed;inset:0;background:#000b;z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#mbox{background:#262b57;border-radius:20px;padding:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto;text-align:center;border:2px solid #ffffff22}
#mbox h2{font-size:21px;margin:4px 0 12px}
#mbox .grid{grid-template-columns:repeat(3,1fr);margin-bottom:6px}
.score{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:10px;background:#fff1;margin:6px 0;font-weight:700}
.winpic{width:52%;border-radius:20px;border:4px solid #ffcb05;margin:4px auto 10px;display:block}
#mute{position:fixed;right:10px;bottom:10px;z-index:50;padding:8px 10px;font-size:18px;border-radius:50%;background:#0007}
.trophy{font-size:64px;animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px) rotate(6deg)}}

.fighter .pic{border-color:var(--pc)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:18px;margin:4px 0 10px}
.net{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:#cfd3f3;font-weight:700}
.net i{width:9px;height:9px;border-radius:50%;background:#3fdc5a;display:inline-block}
.net.bad i{background:#ffb02e;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.rnd .net{margin-left:6px}
.hero{display:flex;justify-content:center;gap:8px;margin:4px 0 16px}
.hero img{width:21%;border-radius:16px;border:3px solid #fff;box-shadow:0 6px 14px #0007}
.tin{width:100%;border:0;border-radius:12px;padding:12px;font-size:18px}
.tin.code{text-align:center;letter-spacing:6px;font-size:22px}
.or{display:flex;align-items:center;gap:10px;color:#b9bfe6;margin:12px 0;font-size:14px}
.or:before,.or:after{content:"";flex:1;height:1px;background:#fff3}
.joinrow{display:flex;gap:8px}.joinrow button{flex:none;padding:0 22px}
button.blue{background:#3d7bff}
.ghost{background:none;color:#c7cbef;text-decoration:underline;font-weight:400;width:100%;padding:10px;font-size:15px}
.err{color:#ff7a7a;text-align:center;min-height:22px;font-weight:700}
.hint{color:#b9bfe6;font-size:13px;text-align:center;line-height:1.5}.hint.warn{color:#ffb4a8}
.spinner{font-size:56px;animation:spin 1.2s linear infinite;display:inline-block}
.roomcode{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lbl{font-size:13px;color:#b9bfe6}.bigcode{font-size:52px;font-weight:900;letter-spacing:6px;line-height:1}
#qr svg{width:110px;height:110px;background:#fff;border-radius:10px;display:block}
.prow{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;background:#ffffff14;margin:6px 0;min-height:46px}
.prow.empty{background:none;border:2px dashed #ffffff26;color:#9aa0cc;justify-content:center}
.prow .pn{flex:1;font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagx{font-size:12px;padding:2px 7px;border-radius:7px;background:#ffffff22}.tagx.me{background:#ffcb05;color:#222}.tagx.off{background:#ffb02e44}
.rm{padding:4px 10px;font-size:14px;background:#ffffff1f}
.addrow{display:flex;gap:6px;margin-top:8px}.addrow .tin{font-size:16px;padding:10px}.addrow button{flex:none;font-size:14px;padding:10px}
.step{display:flex;align-items:center;justify-content:center;gap:14px}.step b{font-size:24px;min-width:80px;text-align:center}.step button{width:46px;height:46px;font-size:24px;padding:0}
.waitmsg{text-align:center;color:#c8cdf0;padding:14px;font-size:16px}
.who .small{font-size:14px;color:#b9bfe6}
.who.myturn{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.card.can{border-color:#ffcb05aa}.card.chosen{border-color:#ffcb05;transform:scale(.95)}
.grid.g3{grid-template-columns:repeat(3,1fr)}
#toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;max-width:92vw}
#toast div{background:#000c;color:#fff;padding:9px 16px;border-radius:12px;font-size:15px;word-break:break-all}
button:disabled{opacity:.4}
#exit{position:fixed;left:10px;top:10px;z-index:55;display:flex;align-items:center;gap:6px;padding:10px 14px;font-size:24px;border-radius:16px;background:#d62828;box-shadow:0 4px 0 #8f1515,0 4px 12px #0008;line-height:1}
#exit span{font-size:16px;font-weight:900}
#exit:active{transform:translateY(3px);box-shadow:0 1px 0 #8f1515}
body.hasExit .topbar{padding-left:128px;min-height:50px}
body.hasExit #hpTop{padding-left:140px;min-height:66px;display:flex;align-items:center}
body.hasExit #hpTop .rnd{flex:1;flex-wrap:wrap;gap:2px 8px}
#confirm{position:fixed;inset:0;z-index:60;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}
#confirm.on{display:flex}
.cbox{background:#262b57;border-radius:20px;padding:22px 18px 18px;max-width:360px;width:100%;text-align:center;border:2px solid #ffffff22}
.cbox p{font-size:18px;font-weight:700;margin:0 0 18px;line-height:1.5}
.crow{display:flex;gap:10px}.crow button{flex:1;padding:14px}.crow .danger{background:#d62828}
.onum{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:13px;font-weight:900;vertical-align:middle}
.onum.sm{width:18px;height:18px;font-size:11px}.onum.big{width:32px;height:32px;font-size:17px;flex:none}
.ob{width:42px;height:40px;padding:0;font-size:15px;flex:none;background:#ffffff22}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>
<div id="flash"></div>
<div id="moveName"></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>
<button id="mute">🔊</button>
<button id="exit" style="display:none"></button>
<div id="confirm"></div>

let AC, NB, muted = false;
function unlockAudio(){ try{ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }
function tone(f,d,type='sine',g=.2,f2=null,delay=0){
  if(!AC||muted) return; const t=AC.currentTime+delay;
  const o=AC.createOscillator(), v=AC.createGain(); o.type=type;
  o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);

function hostBroadcast() {
  const s = H.S; s.ts = Date.now(); s.rev = (+s.rev || 0) + 1;

function hostAction(dev, m) {
  const s = H.S; if (!m || typeof m !== 'object') return;
  if (m.t === 'pick' && s.phase === 'draft') {

    if (p.ai || p.dev !== dev || !(i >= 0 && i < DEX.length) || s.owner[i] != null) return;

}
function startRound() {
  const s = H.S;
  s.f = s.active.map(pi => ({ p: pi, d: s.sel[pi], hp: 100, out: false }));
  if (!s.overtime) { s.round++; s.f.forEach(f => s.players[f.p].used.push(f.d)); }
  s.rk++; s.phase = 'battle'; s.winner = null;
  s.turn = s.overtime ? 0 : (s.round - 1) % s.f.length; // 라운드마다 먼저 공격하는 사람이 순서대로 바뀜 (연장전은 1번부터)
  H.lock = Date.now() + 1000;

function doAttack(mi) {
  const s = H.S; if (s.phase !== 'battle' || s.turn < 0 || Date.now() < H.lock) return;
  const ai = s.turn;
  const targets = s.f.map((_, i) => i).filter(i => i !== ai && !s.f[i].out);
  const res = targets.map(t => { const dmg = rnd(DMG), T = s.f[t]; T.hp = Math.max(0, T.hp - dmg); return [t, dmg, T.hp]; });
  const down = targets.filter(t => s.f[t].hp <= 0); down.forEach(t => s.f[t].out = true);
  s.ev = { seq: s.ev.seq + 1, rk: s.rk, a: ai, mi, res, down };

  H.lock = Date.now() + dur;

function hostOpen(online, resume) {
  role = 'host'; H.last = new Map(); H.everOpen = false; H.claiming = false; H.aiKey = ''; H.lock = 0;
  const saved = resume ? LS.get('kp-host', null) : null;
  if (saved && saved.code) {
    H.S = saved; online = saved.online;
    H.S.players.forEach(p => { if (!p.ai && p.dev !== 'host') p.online = false; });
    if (H.S.phase === 'battle' && H.S.f.filter(x => !x.out).length <= 1) setTimeout(endRound, 500);
  } else {
    H.S = newState(String(1000 + ri(9000)), online);
    H.S.players.push(mkPlayer('host', 'host', me.name, false));
    if (!online) H.S.players.push(mkPlayer('ai-' + rid(6), null, 'AI 피카', true));
  }
  if (H.bus) H.bus.close(); H.bus = null; clearInterval(H.hb);
  if (!online) { hostBroadcast(); return; }
  renderConnecting(resume ? '방을 다시 여는 중…' : '방을 만드는 중…');
  H.bus = new Bus(BROKERS);
  H.bus.onChange(ok => { if (role !== 'host') return; setNet(ok ? 'ok' : 'bad'); if (ok && !H.everOpen) hostClaim(!!saved); });

function guestJoin(code) {
  role = 'guest'; Object.assign(G, { code, joined: false, sawHost: false, okSince: 0, hid: null, rev: -1, lastHeard: 0 });
  renderConnecting(`방 ${code}에 들어가는 중…`);
  if (G.bus) G.bus.close();
  const bus = G.bus = new Bus(BROKERS);
  bus.sub(TOPIC + code + '/s', guestOnMsg);
  bus.onChange(ok => {
    if (role !== 'guest' || G.bus !== bus) return;
    if (ok && !G.okSince) G.okSince = Date.now();
    if (G.joined) setNet(ok ? 'ok' : 'bad');

  });
  clearInterval(G.hb);
  G.hb = setInterval(() => {
    if (role !== 'guest' || G.bus !== bus) return;

    if (G.joined) { if (Date.now() - G.lastHeard > 10000) setNet('bad'); }
    else if (G.okSince && !G.sawHost && Date.now() - G.okSince > 15000) {

}

    G.sawHost = true;

    const rev = +m.s.rev || 0; if (rev <= G.rev) return;

/* ----- 출전 포켓몬 고르기 ----- */

}
function updSelect() {

}

/* ----- 대결 ----- */
const CL = { rk: null, seen: 0, vis: [], animUntil: 0, t: null, pend: 0 };
const animating = () => Date.now() < CL.animUntil;
function mountBattle() {
  const s = S;
  CL.rk = s.rk; CL.seen = s.ev.seq; CL.vis = s.f.map(f => ({ hp: f.hp, out: f.out }));
  app().innerHTML = `<div class="screen on" id="battle"><div id="hpTop"></div><div id="arena"></div><div id="turnInfo"></div><div id="moves"></div><div id="log"></div></div>`;
  $('#arena').innerHTML = s.f.map((f, i) => { const d = DEX[f.d], p = s.players[f.p];
    return `<div class="fighter" id="f${i}">
      <div class="hpBox"><div class="bar"><i></i></div><div class="hpNum"></div></div>
      <div class="pic" style="--pc:${pColor(f.p)}"><img src="${IMG[d.k]}"><div class="face">😣</div>${eyesHTML(d.k)}</div>
      <div class="tag">${d.n}</div><div class="ptag" style="color:${pColor(f.p)}"><span class="onum sm" style="background:${pColor(f.p)}">${f.p + 1}</span> ${esc(p.name)}${p.ai ? ' 🤖' : ''}${mine(p) && s.online ? ' (나)' : ''}</div></div>`; }).join('');
  $('#moves').onclick = e => { const b = e.target.closest('button[data-i]'); if (!b || animating() || Date.now() < CL.pend) return; CL.pend = Date.now() + 1800; unlockAudio(); renderTurn(); later(1800); send({ t: 'attack', mi: +b.dataset.i }); };
  if (s.phase === 'battle' && s.ev.rk !== s.rk) {
    CL.animUntil = Date.now() + 1300;
    showMoveName(s.overtime ? '🔥 연장전 시작! 🔥' : `라운드 ${s.round} 시작!`, '#ffcb05'); sfx('pick');
  }
  paintVis(); later();
}
function later(ms) { clearTimeout(CL.t); const w = ms != null ? ms : CL.animUntil - Date.now(); CL.t = setTimeout(() => { if (S && mountKey === 'battle' + S.rk) updBattle(); }, Math.max(0, w) + 30); }
function paintVis() {
  CL.vis.forEach((v, i) => { const fe = $(`#f${i}`); if (!fe) return;
    const b = fe.querySelector('.bar'); b.className = 'bar ' + (v.hp > 50 ? 'g' : v.hp > 20 ? 'y' : 'r'); b.firstElementChild.style.width = v.hp + '%';
    fe.querySelector('.hpNum').textContent = `${v.hp} / 100`; fe.classList.toggle('out', v.out); });
}
function updBattle() {
  const s = S;
  if (s.rk !== CL.rk) { mountKey = null; onState(s); return; }
  setHTML($('#hpTop'), s.overtime ? '<div class="rnd"><span>🔥 연장전</span><span>대표 1마리 승부</span></div>'
    : `<div class="rnd"><span>라운드 ${s.round} / ${s.per}</span><span>${s.players.map((p, i) => `<span style="color:${pColor(i)}">${esc(p.name)} ${p.wins}</span>`).join(' · ')}</span>${netHTML()}</div>`);
  if (s.ev.seq > CL.seen && s.ev.rk === s.rk) { CL.seen = s.ev.seq; playEv(s.ev); }
  else if (!animating()) { CL.vis = s.f.map(f => ({ hp: f.hp, out: f.out })); paintVis(); }
  renderTurn(); showPhaseModal();
}
function renderTurn() {
  const s = S, busy = animating() || Date.now() < CL.pend;
  $$('.fighter').forEach((fe, i) => fe.classList.toggle('turn', !busy && s.phase === 'battle' && i === s.turn));
  const f = s.phase === 'battle' && s.turn >= 0 ? s.f[s.turn] : null;
  if (!f) { setHTML($('#turnInfo'), ''); setHTML($('#moves'), busy ? '<div class="wait">⚔️ 공격 중…</div>' : ''); return; }
  const p = s.players[f.p], my = mine(p);
  setHTML($('#turnInfo'), `<span style="color:${pColor(f.p)}">${esc(p.name)}</span>의 ${DEX[f.d].n} 차례!`);
  if (busy) { setHTML($('#moves'), '<div class="wait">⚔️ 공격 중…</div>'); return; }
  if (!my) { setHTML($('#moves'), `<div class="wait">${p.ai ? '🤖 기술을 고르는 중…' : !p.online && p.dev !== 'host' ? '📴 연결이 끊겨서 잠시 후 자동으로 공격해요' : `${esc(p.name)}님이 기술을 고르는 중…`}</div>`); return; }
  const dark = ['ice','moon','star','normal','sound','coin','solar','elec','bite','steel'];
  setHTML($('#moves'), DEX[f.d].m.map(([n, k], i) => `<button data-i="${i}" style="background:${EFX[k].c}cc;color:${dark.includes(k) ? '#222' : '#fff'};text-shadow:none">${EFX[k].e} ${n}</button>`).join(''));
}
function log(h) { $('#log').insertAdjacentHTML('afterbegin', `<div>${h}</div>`); }
async function playEv(ev) {
  const s = S, rk = s.rk, A = s.f[ev.a], d = DEX[A.d], [mn, k] = d.m[ev.mi], E = EFX[k];
  CL.pend = 0; CL.animUntil = Date.now() + ANIM + (ev.down.length ? FAINT : 0); renderTurn();
  const alive = () => S && S.rk === rk && $('#arena');
  showMoveName(`${E.e} ${mn}!`, E.c);
  log(`<b style="color:${pColor(A.p)}">${d.n}</b>의 <b>${mn}</b>!`);
  await sleep(450); if (!alive()) return;
  sfx(E.s);
  await Promise.all(ev.res.map(([t]) => projectile(ev.a, t, E, k))); if (!alive()) return;
  let hit = false, miss = false;
  ev.res.forEach(([t, dmg, hp]) => { CL.vis[t].hp = hp; hitFx(t, dmg); dmg ? hit = true : miss = true; });
  paintVis();
  if (hit) sfx('hit'); if (miss) { sfx('miss'); setTimeout(() => sfx('taunt'), hit ? 250 : 0); }
  log('　→ ' + ev.res.map(([t, dmg]) => `${DEX[S.f[t].d].n} ${dmg ? '-' + dmg : '빗나감'}`).join(', '));
  await sleep(1100); if (!alive()) return;
  if (ev.down.length) { ev.down.forEach(t => { CL.vis[t].out = true; log(`💫 ${DEX[S.f[t].d].n} 쓰러졌다!`); }); paintVis(); sfx('faint'); }
  later();
}
function hitFx(t, dmg) {
  const fe = $(`#f${t}`), pic = fe.querySelector('.pic');
  const n = document.createElement('div'); n.className = 'dmg' + (dmg ? '' : ' miss'); n.textContent = dmg ? `-${dmg}` : '빗나감!'; pic.appendChild(n); setTimeout(() => n.remove(), 1500);
  if (!dmg) { const fc = pic.querySelector('.face'); fc.textContent = '😏'; pic.classList.add('smug'); setTimeout(() => { pic.classList.remove('smug'); fc.textContent = '😣'; }, 1200); return; }
  pic.classList.remove('shake'); void pic.offsetWidth; pic.classList.add('shake', 'hurt');
  setTimeout(() => pic.classList.remove('hurt'), 1100);
}
function confetti() {
  for (let i = 0; i < 40; i++) { const x = Math.random() * innerWidth; part(x, -30, rnd(['🎉','⭐','🎊','✨','🏆']), (Math.random() - .5) * 120, innerHeight * .8 + Math.random() * 200, 1800 + Math.random() * 900, 26 + Math.random() * 14, Math.random() * 720); }
}
function scoreHTML() { return S.players.map((p, i) => `<div class="score"><span style="color:${pColor(i)}">${esc(p.name)}${mine(p) && S.online ? ' (나)' : ''}</span><span>🏅 ${p.wins}승</span></div>`).join(''); }
function showPhaseModal() {
  const s = S, host = role === 'host';
  if (!['roundEnd', 'tie', 'final'].includes(s.phase)) return;
  if (animating()) { later(); return; }
  const key = s.phase + s.rk + ':' + s.game;
  const first = modalKey !== key; modalKey = key;
  const waitTxt = t => `<div class="waitmsg">${t}</div>`;
  if (s.phase === 'roundEnd') {
    const w = s.winner, p = s.players[w.p], last = s.round >= s.per;
    if (first) { const wi = s.f.findIndex(f => f.p === w.p); $$('.fighter').forEach((fe, i) => fe.classList.toggle('turn', i === wi)); sfx('fanfare'); confetti(); }
    modal(`<div class="trophy">🏆</div><h2><span style="color:${pColor(w.p)}">${esc(p.name)}</span>의<br>${DEX[w.d].n} 승리!</h2>
      <img class="winpic" src="${IMG[DEX[w.d].k]}">${scoreHTML()}
      ${host ? `<button class="big" id="nextBtn">${last ? '최종 결과 보기 ▶' : '다음 라운드 ▶'}</button>` : waitTxt('호스트가 다음으로 넘겨요…')}`);
  } else if (s.phase === 'tie') {
    if (first) sfx('pick');
    modal(`<div class="trophy">⚔️</div><h2>동점! 연장전!</h2>
      <div class="sub">${s.active.map(i => `<b style="color:${pColor(i)}">${esc(s.players[i].name)}</b>`).join(' vs ')}<br>팀에서 대표 포켓몬 1마리를 골라 마지막 승부!</div>
      ${scoreHTML()}${host ? '<button class="big" id="nextBtn">연장전 시작 ▶</button>' : waitTxt('호스트가 연장전을 시작해요…')}`);
  } else {
    const p = s.players[s.champ];
    if (first) { sfx('fanfare'); setTimeout(() => sfx('fanfare'), 1900); confetti(); setTimeout(confetti, 1200); }
    modal(`<div class="trophy">👑</div><h2>최종 우승<br><span style="color:${pColor(s.champ)};font-size:30px">${esc(p.name)}</span></h2>
      ${s.winner ? `<img class="winpic" src="${IMG[DEX[s.winner.d].k]}">` : ''}
      <div class="chips" style="justify-content:center;margin-bottom:10px">${p.team.map(i => `<span class="chip">${DEX[i].n}</span>`).join('')}</div>
      ${scoreHTML()}${host ? '<button class="big" id="againBtn">다시 하기 🔄</button>' : waitTxt('호스트가 다시 하기를 누르면 대기실로 가요')}`);
  }
  if ($('#nextBtn')) $('#nextBtn').onclick = () => hostCmd.next();
  if ($('#againBtn')) $('#againBtn').onclick = () => hostCmd.again();
}


/* ---------- 실시간 연결 ----------
   공개 MQTT 중계 서버(웹소켓) 여러 곳에 동시에 접속해서 같은 메시지를 모두에 보냅니다.
   한두 곳이 멈춰도 나머지로 계속 연결됩니다. (받은 메시지는 중복 제거) */
const BROKERS = Q.get('broker') ? Q.get('broker').split(',') : [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://test.mosquitto.org:8081/mqtt'
];
const TOPIC = 'kpoke/v1/';
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const enc = new TextEncoder(), dec = new TextDecoder();
const sleep = ms => new Promise(r => setTimeout(r, ms));
function cat(...parts) { let n = 0; parts.forEach(p => n += p.length); const u = new Uint8Array(n); let o = 0; parts.forEach(p => { u.set(p, o); o += p.length; }); return u; }
const u16 = n => Uint8Array.of((n >> 8) & 255, n & 255);
const mqs = s => { const b = enc.encode(s); return cat(u16(b.length), b); };
function pkt(head, body) {
  const len = []; let n = body.length;
  do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; len.push(d); } while (n > 0);
  return cat(Uint8Array.of(head, ...len), body);
}
class Mq { // MQTT 3.1.1 (QoS 0) 최소 구현
  constructor(url, bus) { this.url = url; this.bus = bus; this.ws = null; this.ok = false; this.buf = new Uint8Array(0); this.pid = 1; this.wait = 1000; this.dead = false; this.last = 0; this.open(); }
  open() {
    if (this.dead) return;
    let ws;
    try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { this.retry(); return; }
    this.ws = ws; ws.binaryType = 'arraybuffer'; this.buf = new Uint8Array(0);
    const to = setTimeout(() => { if (this.ws === ws && !this.ok) try { ws.close(); } catch (e) {} }, 9000);
    ws.onopen = () => { this.send(pkt(0x10, cat(mqs('MQTT'), Uint8Array.of(4, 2, 0, 45), mqs("kp" + rid(16))))); };
    ws.onmessage = ev => { this.last = Date.now(); if (ev.data instanceof ArrayBuffer) this.feed(new Uint8Array(ev.data)); };
    ws.onclose = ws.onerror = () => {
      clearTimeout(to);
      if (this.ws !== ws) return;
      this.ws = null; clearInterval(this.ping);
      const was = this.ok; this.ok = false;
      if (was) this.bus.changed();
      this.retry();
    };
  }
  retry() { if (this.dead) return; clearTimeout(this.rt); this.rt = setTimeout(() => this.open(), this.wait); this.wait = Math.min(this.wait * 2, 15000); }
  kick() { if (!this.dead && !this.ws) { clearTimeout(this.rt); this.wait = 1000; this.open(); } } // 화면 복귀 시 바로 재접속
  feed(chunk) {
    this.buf = this.buf.length ? cat(this.buf, chunk) : chunk;
    for (;;) {
      const b = this.buf; if (b.length < 2) return;
      let mul = 1, len = 0, i = 1, d;
      do { if (i >= b.length) return; d = b[i++]; len += (d & 127) * mul; mul *= 128; } while ((d & 128) && i < 5);
      if (b.length < i + len) return;
      this.packet(b[0], b.subarray(i, i + len));
      this.buf = b.subarray(i + len);
    }
  }
  packet(h, body) {
    const type = h >> 4;
    if (type === 2) { // CONNACK
      if (body[1] !== 0) { try { this.ws.close(); } catch (e) {} return; }
      this.ok = true; this.wait = 1000;
      for (const t of this.bus.topics) this.subscribe(t);
      clearInterval(this.ping);
      this.ping = setInterval(() => {
        if (!this.ok) return;
        if (Date.now() - this.last > 50000) { try { this.ws.close(); } catch (e) {} return; }
        this.send(Uint8Array.of(0xC0, 0));
      }, 20000);
      this.bus.changed();
    } else if (type === 3) { // PUBLISH
      const qos = (h >> 1) & 3, tl = (body[0] << 8) | body[1];
      const topic = dec.decode(body.subarray(2, 2 + tl));
      const o = 2 + tl + (qos ? 2 : 0);
      this.bus.incoming(topic, dec.decode(body.subarray(o)));
    }
  }
  send(u) { try { if (this.ws && this.ws.readyState === 1) { this.ws.send(u); return true; } } catch (e) {} return false; }
  nextId() { this.pid = (this.pid % 65535) + 1; return this.pid; }
  subscribe(t) { if (this.ok) this.send(pkt(0x82, cat(u16(this.nextId()), mqs(t), Uint8Array.of(0)))); }
  unsubscribe(t) { if (this.ok) this.send(pkt(0xA2, cat(u16(this.nextId()), mqs(t)))); }
  publish(t, s) { return this.ok && this.send(pkt(0x30, cat(mqs(t), enc.encode(s)))); }
  close() {
    this.dead = true; clearTimeout(this.rt); clearInterval(this.ping);
    const ws = this.ws; this.ws = null; this.ok = false;
    if (ws) { try { if (ws.readyState === 1) ws.send(Uint8Array.of(0xE0, 0)); ws.close(); } catch (e) {} }
  }
}
class Bus {
  constructor(urls) { this.topics = new Set(); this.handlers = new Map(); this.seen = new Set(); this.seenQ = []; this.fns = []; this.conns = urls.map(u => new Mq(u, this)); }
  get ok() { return this.conns.some(c => c.ok); }
  changed() { const ok = this.ok; this.fns.forEach(f => { try { f(ok); } catch (e) { console.error(e); } }); }
  onChange(f) { this.fns.push(f); }
  sub(t, fn) { this.topics.add(t); this.handlers.set(t, fn); this.conns.forEach(c => c.subscribe(t)); }
  unsub(t) { this.topics.delete(t); this.handlers.delete(t); this.conns.forEach(c => c.unsubscribe(t)); }
  mark(id) { this.seen.add(id); this.seenQ.push(id); if (this.seenQ.length > 800) this.seen.delete(this.seenQ.shift()); }
  pub(t, obj) {
    obj.mid = rid(10); this.mark(obj.mid);
    const s = JSON.stringify(obj); let n = 0;
    this.conns.forEach(c => { if (c.publish(t, s)) n++; });
    return n > 0;
  }
  incoming(t, s) {
    let m; try { m = JSON.parse(s); } catch (e) { return; }
    if (!m || typeof m !== 'object' || typeof m.mid !== 'string') return;
    if (this.seen.has(m.mid)) return; this.mark(m.mid);
    const h = this.handlers.get(t); if (h) h(m);
  }
  kick() { this.conns.forEach(c => c.kick()); }
  close() { this.fns = []; this.handlers.clear(); this.conns.forEach(c => c.close()); }
}
